<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gems & Mines Signal</title>
    <style>
        body {
            background-color: #0b132b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
        }
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 320px;
            margin: 20px auto;
        }
        .mine-cell {
            aspect-ratio: 1;
            background: #1c2541;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #3a506b;
        }
        .gem {
            background: #4cc9f0;
            border-color: #489fb5;
            box-shadow: 0 0 10px #4cc9f0;
        }
        button {
            padding: 12px 24px;
            background: #f72585;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>💎 Gems & Mines Signal</h2>
    <p>Olmoslar joylashishini aniqlash:</p>

    <div class="mines-grid" id="minesGrid"></div>

    <button onclick="generateMines()">SIGNALNI KO'RSAT</button>

    <script>
        function initGrid() {
            const grid = document.getElementById('minesGrid');
            grid.innerHTML = "";
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.id = `m-cell-${i}`;
                cell.innerText = "❓";
                grid.appendChild(cell);
            }
        }

        function generateMines() {
            initGrid();
            // Tasodifiy 5 ta olmos joyini belgilaymiz
            let opened = 0;
            while(opened < 5) {
                let randomIndex = Math.floor(Math.random() * 25);
                let cell = document.getElementById(`m-cell-${randomIndex}`);
                if (!cell.classList.contains('gem')) {
                    cell.classList.add('gem');
                    cell.innerText = "💎";
                    opened++;
                }
            }
        }

        initGrid();
    </script>
</body>
</html>
