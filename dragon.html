<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon's Gold Signal</title>
    <style>
        body {
            background-color: #1b2838;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
        }
        .grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .row {
            display: flex;
            gap: 8px;
        }
        .cell {
            width: 50px;
            height: 50px;
            background: #2a475e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid #3c6382;
        }
        .active {
            background: #f39c12;
            border-color: #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background: #d35400;
        }
    </style>
</head>
<body>

    <h2>🐉 Dragon's Gold Signal</h2>
    <p>Signal olish uchun tugmani bosing (Maks: 4.02x)</p>

    <div class="grid" id="grid"></div>

    <button onclick="generateSignal()">SIGNAL OLISH</button>

    <script>
        // Talabingiz bo'yicha 4.02x gacha bo'lgan qatorlar
        const multipliers = ["x 4.02", "x 2.41", "x 1.93", "x 1.54", "x 1.23"];
        
        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            
            multipliers.forEach((mult, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                
                // Dragon's Gold da ham 5 tadan katak bo'ladi
                for (let i = 0; i < 5; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${rowIndex}-${i}`;
                    cell.innerText = "🪙";
                    rowDiv.appendChild(cell);
                }
                
                // Koeffitsient yozuvi
                const label = document.createElement('div');
                label.style.lineHeight = "50px";
                label.style.marginLeft = "10px";
                label.style.fontSize = "14px";
                label.style.color = "#f1c40f";
                label.innerText = mult;
                rowDiv.appendChild(label);
                
                grid.appendChild(rowDiv);
            });
        }

        function generateSignal() {
            createGrid();
            // Har bir qatordan bittadan tasodifiy katakni oltin (active) qilish
            multipliers.forEach((_, rowIndex) => {
                const randomCol = Math.floor(Math.random() * 5);
                const selectedCell = document.getElementById(`cell-${rowIndex}-${randomCol}`);
                selectedCell.classList.add('active');
                selectedCell.innerText = "⭐";
            });
        }

        createGrid();
    </script>
</body>
</html>
